name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: write
  packages: write

jobs:
  # Check if this is a merge commit (not just a direct push to main)
  check-merge:
    runs-on: ubuntu-latest
    outputs:
      is-merge: ${{ steps.check.outputs.is-merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Check if merge commit
        id: check
        run: |
          # Check if this is a merge commit by looking at parent count
          PARENT_COUNT=$(git rev-list --count --parents HEAD^..HEAD | cut -d' ' -f1)
          if [ "$PARENT_COUNT" -gt 1 ]; then
            echo "is-merge=true" >> $GITHUB_OUTPUT
            echo "This is a merge commit"
          else
            echo "is-merge=false" >> $GITHUB_OUTPUT
            echo "This is not a merge commit"
          fi
      


  test:
    runs-on: ubuntu-latest
    needs: check-merge
    if: needs.check-merge.outputs.is-merge == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm run test
        env:
          RD_GITHUB_CLIENT_ID: ${{ secrets.RD_GITHUB_CLIENT_ID }}
          RD_GITHUB_CLIENT_SECRET: ${{ secrets.RD_GITHUB_CLIENT_SECRET }}
          RD_JWT_SECRET: ${{ secrets.RD_JWT_SECRET }}

  build:
    runs-on: ubuntu-latest
    needs: [check-merge, test]
    if: needs.check-merge.outputs.is-merge == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: v1.1.42
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          RD_JWT_SECRET: ${{ secrets.RD_JWT_SECRET }}
          RD_GITHUB_CLIENT_ID: ${{ secrets.RD_GITHUB_CLIENT_ID }}
          RD_GITHUB_CLIENT_SECRET: ${{ secrets.RD_GITHUB_CLIENT_SECRET }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            Dockerfile
            fly.toml

  release:
    runs-on: ubuntu-latest
    needs: [check-merge, build]
    if: needs.check-merge.outputs.is-merge == 'true'
    outputs:
      release-created: ${{ steps.semantic-release.outputs.new-release-published }}
      version: ${{ steps.semantic-release.outputs.new-release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_PAT }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
        run: pnpm run semantic-release

  deploy:
    runs-on: ubuntu-latest
    needs: [check-merge, build, release]
    if: needs.release.outputs.release-created == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RD_JWT_SECRET: ${{ secrets.RD_JWT_SECRET }}
          RD_GITHUB_CLIENT_ID: ${{ secrets.RD_GITHUB_CLIENT_ID }}
          RD_GITHUB_CLIENT_SECRET: ${{ secrets.RD_GITHUB_CLIENT_SECRET }}
      
      - name: Update release with deployment info
        if: needs.release.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
          NEW_VERSION: v${{ needs.release.outputs.version }}
        run: |
          # Add deployment success note to release
          gh release edit "$NEW_VERSION" \
            --notes-file <(gh release view "$NEW_VERSION" --json body -q .body && echo -e "\n\n✅ **Deployment Status**: Successfully deployed to production at $(date -u '+%Y-%m-%d %H:%M:%S UTC')")
